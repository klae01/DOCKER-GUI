version: '1'
services:
  gui1:
    build: ./virtual-gui
    container_name: gui1
    networks:
      - gui_net

  gui2:
    build: ./virtual-gui
    container_name: gui2
    networks:
      - gui_net

  control:
    build: ./control
    container_name: control
    depends_on:
      - gui1
      - gui2
    networks:
      - gui_net
    volumes:
      - shared_volume:/shared

volumes:
  shared_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: shared_dir

networks:
  gui_net:
    driver: bridge
